name: Test additional_filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with additional_filter to exclude labeled PRs
        id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          renovate_login: app/renovate
          created_before_minutes: 10
          additional_filter: '-label:skip-autoclose'
        continue-on-error: true

      - name: Assert action ran with additional_filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an API error
          # It must NOT fail due to invalid additional_filter handling
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with additional_filter (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
