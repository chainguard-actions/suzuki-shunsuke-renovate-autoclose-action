name: Test custom created_before_minutes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          created_before_minutes: 60
      - name: Assert action completed successfully with custom age
        run: |
          echo "Action completed with created_before_minutes=60"
          echo "PASS"
