name: Test custom renovate_login and additional_filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          renovate_login: 'app/renovate'
          additional_filter: 'label:dependencies'
          created_before_minutes: 5
      - name: Assert action completed successfully with custom filter
        run: |
          echo "Action completed with custom renovate_login and additional_filter"
          echo "PASS"
